# Talvyn — Nginx / OpenResty reverse proxy
#
# Single entry point on port 80:
#   /              → Next.js frontend   (container: frontend:3000)
#   /api/v1/       → FastAPI backend    (container: backend:8000)
#   /mailpit/      → Mailpit web UI     (container: mailpit:8025)
#   /minio-console → MinIO web console  (container: minio:9001)
#
# JWT validation for /api/v1/* routes is handled by lua/jwt_check.lua
# (a structural check only — confirms a valid NextAuth session cookie exists
# before the request reaches FastAPI).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Don't leak the nginx/OpenResty version in the Server header.
    server_tokens off;

    # ── Slow-attack guards (Slowloris etc.) ───────────────────
    # Cap how long a client can take to send headers/body before we
    # give up on the connection.
    client_header_timeout 15s;
    client_body_timeout    15s;
    send_timeout           15s;

    # ── Per-IP coarse rate + connection limits (proxy-layer guard) ──
    # FastAPI still enforces the finer per-user Redis limits inside.
    # This is just a first-line defence against port scanners / bots /
    # request floods hitting any route, not only the API.
    limit_req_zone  $binary_remote_addr zone=api:10m  rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=web:10m  rate=60r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # ── Baseline security headers for everything (Next.js also sets
    # its own on rendered pages — this covers /api/v1/* and the other
    # proxied paths those headers don't reach). ───────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Upstream blocks ───────────────────────────────────────
    upstream frontend  { server frontend:3000; }
    upstream backend   { server backend:8000; }
    upstream mailpit   { server mailpit:8025; }
    upstream minio_ui  { server minio:9001; }

    server {
        # Matches the host port mapping in docker-compose.yml ("81:81") —
        # change both together if you need a different port.
        listen 81;
        server_name _;

        # Cap concurrent connections per IP across every route below.
        limit_conn conn 20;

        # ── FastAPI — REST API ─────────────────────────────────
        location /api/v1/ {
            # Lua JWT structural check — rejects requests with no valid
            # NextAuth session cookie before they touch Python.
            access_by_lua_file /usr/local/openresty/nginx/lua/jwt_check.lua;

            limit_req zone=api burst=40 nodelay;

            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Allow large JD file uploads (default is 1 MB)
            client_max_body_size 25M;

            # Long timeout for Ollama generation/evaluation calls
            proxy_read_timeout    700s;
            proxy_send_timeout    700s;
            proxy_connect_timeout  10s;

            # SSE: disable proxy buffering so events reach clients immediately
            proxy_buffering       off;
            proxy_cache           off;
        }

        # ── Mailpit dev email web UI ───────────────────────────
        location /mailpit/ {
            limit_req zone=web burst=50 nodelay;
            proxy_pass         http://mailpit/;
            proxy_set_header   Host $host;
        }

        # ── MinIO web console ─────────────────────────────────
        location /minio-console/ {
            limit_req zone=web burst=50 nodelay;
            proxy_pass         http://minio_ui/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            # MinIO console uses WebSocket for live log streaming
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }

        # ── Next.js admin API proxy (long-running calls) ──────
        # /api/proxy/* forwards to FastAPI via the Next.js server itself
        # (see frontend/src/app/api/proxy/[...path]/route.ts, which already
        # gives question-bank generate/regenerate, test generation, and the
        # AI checker a 400s axios timeout). The catch-all `/` location below
        # only allows 120s, which was cutting these requests off with a 504
        # before the Next.js-side timeout (or the backend itself) ever got
        # a chance to finish — matched here first, with the same long
        # timeout as the direct /api/v1/ location above.
        location /api/proxy/ {
            limit_req zone=web burst=100 nodelay;

            proxy_pass         http://frontend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout    700s;
            proxy_send_timeout    700s;
            proxy_connect_timeout  10s;
        }

        # ── Candidate magic-link routes ────────────────────────
        # The URL path contains the single-use exam token, so: never write
        # these paths to the access log, tell browsers to send no referrer,
        # keep them out of search indexes, and forbid caching. (add_header
        # in a location block replaces inherited headers, so the baseline
        # security headers are repeated here.)
        location ~ ^/(test|tests|exam)/ {
            access_log off;

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header Cache-Control "no-store" always;

            limit_req zone=web burst=100 nodelay;

            proxy_pass         http://frontend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 120s;
        }

        # ── Next.js frontend (catch-all) ──────────────────────
        location / {
            limit_req zone=web burst=100 nodelay;

            proxy_pass         http://frontend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Next.js HMR WebSocket (dev only)
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";

            proxy_read_timeout 120s;
        }
    }
}
